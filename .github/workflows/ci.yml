name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ddgs curl_cffi playwright trafilatura crawl4ai \
            beautifulsoup4 fastembed readability-lxml html2text \
            rank-bm25 htmldate pytest
          playwright install chromium --with-deps

      - name: Run test suite
        env:
          WEB_SEARCH_NO_SKILL_VENV: "1"
        run: python -m pytest tests/ -q
