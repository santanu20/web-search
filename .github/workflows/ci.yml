name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded commits from the same PR/branch instead of spending runner
# time installing the same heavy browser/ML stack for stale revisions.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q web_search.py tests

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run test suite
        env:
          WEB_SEARCH_NO_SKILL_VENV: "1"
        run: python -m pytest tests/ -q --strict-markers
